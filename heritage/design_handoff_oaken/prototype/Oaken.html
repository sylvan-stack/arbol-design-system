<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oaken — Task Workspace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="shared/tokens.css" />
  <style>
    @keyframes arbolpulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--arbol-color-ok) 55%, transparent); } 70% { box-shadow: 0 0 0 5px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
    @keyframes arbolfade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes arbolpop { from { opacity: 0; transform: translateY(6px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* ───────────────────────── Pool (ported sketch) ───────────────────────── */
    .pool { position: relative; height: 100%; min-height: 0; display: grid; grid-template-columns: 64px minmax(0, 1fr); overflow: hidden; }
    .scroller { position: relative; overflow: hidden; cursor: grab; }
    .scroller.grab { cursor: grabbing; }
    .world { position: relative; will-change: transform; }
    .axiscol .world { border-right: 1px solid var(--arbol-color-hairline); }
    .tick { position: absolute; right: 0; width: 100%; transform: translateY(50%); padding-right: 7px; text-align: right; color: var(--arbol-color-text-muted); font: 500 calc(10px * var(--arbol-font-scale))/1 var(--arbol-font-mono); white-space: nowrap; }
    .tick::after { content: ""; position: absolute; right: -1px; top: 50%; width: 5px; height: 1px; background: var(--arbol-color-border); }
    .tick.faint { opacity: .4; }
    .tick.now { color: var(--arbol-color-accent); font-weight: 700; }
    .daylabel { position: absolute; left: 4px; transform: translateY(50%); font: 700 calc(9px * var(--arbol-font-scale))/1 var(--arbol-font-mono); letter-spacing: .3px; color: var(--arbol-color-text); white-space: nowrap; }
    .nightgap { position: absolute; left: 0; right: 0; z-index: 0; background: repeating-linear-gradient(45deg, color-mix(in oklch, var(--arbol-color-text-muted) 10%, transparent) 0 6px, transparent 6px 13px); border-top: 1px dashed var(--arbol-color-hairline); border-bottom: 1px dashed var(--arbol-color-hairline); display: grid; place-items: center; }
    .nightgap span { font: 600 calc(9px * var(--arbol-font-scale))/1 var(--arbol-font-mono); letter-spacing: 1px; color: var(--arbol-color-text-muted); text-transform: uppercase; opacity: .7; }
    .lanes { position: absolute; inset: 0; display: flex; gap: 8px; padding: 0 var(--arbol-space-3); align-items: stretch; z-index: 2; }
    .lane { position: relative; min-width: 0; border-radius: 10px 10px 0 0; box-shadow: inset 0 0 0 1px var(--arbol-color-hairline); }
    .lane.empty { opacity: .45; }
    .track { position: absolute; inset: 0; display: flex; }
    .col { position: relative; flex: 1; }
    .col + .col { border-left: 1px solid color-mix(in oklch, var(--arbol-color-text-muted) 24%, transparent); }
    .empty-note { position: absolute; inset: 0; display: grid; place-items: center; color: var(--arbol-color-text-muted); writing-mode: vertical-rl; transform: rotate(180deg); font: 500 calc(9px * var(--arbol-font-scale))/1 var(--arbol-font-mono); letter-spacing: 2px; text-transform: uppercase; opacity: .6; }
    .headrow { position: absolute; top: 0; left: 0; right: 0; z-index: 6; display: flex; gap: 6px; padding: 0 var(--arbol-space-3); pointer-events: none; }
    .headcell { min-width: 0; padding: 6px 6px 9px; text-align: center; background: linear-gradient(180deg, var(--arbol-color-bg) 70%, transparent); }
    .headcell.empty { opacity: .5; }
    .lane-num { font: 600 calc(9px * var(--arbol-font-scale))/1 var(--arbol-font-mono); color: var(--arbol-color-text-muted); letter-spacing: .5px; }
    .lane-tkt { margin-top: 3px; font: 600 calc(11px * var(--arbol-font-scale))/1 var(--arbol-font-ui); color: var(--arbol-color-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: auto; cursor: pointer; border-radius: 5px; padding: 2px 4px; transition: background .12s, color .12s; }
    .lane-tkt:hover { background: var(--arbol-color-accent-soft); color: var(--arbol-color-accent); }
    .seg { position: absolute; left: 50%; transform: translateX(-50%); width: 26px; }
    .seg.past { background: color-mix(in oklch, var(--arbol-color-text-muted) 36%, var(--arbol-color-surface)); border-radius: 3px 3px 8px 8px; box-shadow: inset 0 0 0 1px var(--arbol-color-hairline); }
    .seg.future { border-radius: 8px 8px 3px 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
    .seg.future.plan { border-radius: 8px; }
    .seg.blocked { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0) 0 5px, rgba(0,0,0,0.16) 5px 10px); }
    .seg.over { border-radius: 8px 8px 0 0; background: repeating-linear-gradient(45deg, oklch(0.62 0.165 25) 0 5px, oklch(0.76 0.085 24) 5px 10px); }
    .wall { position: absolute; left: 2px; right: 2px; height: 0; border-top: 2px solid; transform: translateY(50%); z-index: 3; }
    .wall .flag { position: absolute; right: 0; top: -8px; font: 600 calc(8.5px * var(--arbol-font-scale))/1 var(--arbol-font-mono); padding: 2px 6px; border-radius: 5px; white-space: nowrap; }
    .namelabel { position: absolute; left: 50%; transform: translate(-50%,50%); z-index: 7; cursor: default; display: flex; align-items: center; gap: 5px; max-width: 240px; font: 600 calc(10px * var(--arbol-font-scale))/1.05 var(--arbol-font-ui); padding: 4px 8px; border-radius: 7px; background: var(--arbol-color-surface); border: 1px solid var(--arbol-color-border); box-shadow: var(--arbol-shadow-1); }
    .namelabel .nm-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .namelabel .src { font: 600 calc(7.5px * var(--arbol-font-scale))/1 var(--arbol-font-mono); color: var(--arbol-color-text-muted); flex-shrink: 0; }
    .cap { position: absolute; left: 50%; transform: translate(-50%,-5px); z-index: 5; white-space: nowrap; font: 600 calc(9px * var(--arbol-font-scale))/1 var(--arbol-font-mono); padding: 2px 6px; border-radius: 99px; background: var(--arbol-color-surface); border: 1px solid var(--arbol-color-border); }
    .cap.over { color: var(--arbol-color-err); border-color: var(--arbol-color-err); }
    .startmark { position: absolute; left: 50%; transform: translate(-50%,50%); z-index: 5; white-space: nowrap; font: 600 calc(8px * var(--arbol-font-scale))/1 var(--arbol-font-mono); color: var(--arbol-color-text-muted); background: var(--arbol-color-surface); border: 1px dashed var(--arbol-color-border); border-radius: 99px; padding: 2px 6px; }
    .timer { position: absolute; right: 2px; transform: translateY(150%); z-index: 5; white-space: nowrap; font: 600 calc(8.5px * var(--arbol-font-scale))/1 var(--arbol-font-mono); padding: 2px 5px; border-radius: 5px; background: var(--arbol-color-surface); border: 1px solid var(--arbol-color-border); }
    .timer.over { color: var(--arbol-color-err); border-color: var(--arbol-color-err); }
    .grid { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .gridline { position: absolute; left: 0; right: 0; height: 0; }
    .gridline.hour { border-top: 1px solid color-mix(in oklch, var(--arbol-color-text-muted) 15%, transparent); }
    .gridline.half { border-top: 1px dashed color-mix(in oklch, var(--arbol-color-text-muted) 9%, transparent); }
    .timetip { position: absolute; z-index: 30; pointer-events: none; display: none; transform: translateY(-50%); white-space: nowrap; background: var(--arbol-color-surface); border: 1px solid var(--arbol-color-accent); border-radius: 6px; padding: 3px 7px; font: 600 calc(9px * var(--arbol-font-scale))/1 var(--arbol-font-mono); color: var(--arbol-color-text); box-shadow: var(--arbol-shadow-2); }
    .nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--arbol-color-accent); box-shadow: 0 0 14px 1px var(--arbol-color-accent); z-index: 4; }

    /* ───────────────────────── Swimlane Details ───────────────────────── */
    .dpool { position: relative; height: 100%; min-height: 0; display: grid; grid-template-columns: 56px minmax(0, 1fr); overflow: hidden; }
    .daxis { position: relative; overflow: hidden; border-right: 1px solid var(--arbol-color-hairline); }
    .dscroller { position: relative; overflow: hidden; cursor: grab; }
    .dscroller:active { cursor: grabbing; }
    .dworld { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
    .daxis .dworld { right: 0; }
    .dtick { position: absolute; right: 0; width: 100%; transform: translateY(50%); padding-right: 7px; text-align: right; color: var(--arbol-color-text-muted); font: 500 calc(10px * var(--arbol-font-scale))/1 var(--arbol-font-mono); white-space: nowrap; }
    .dtick::after { content: ""; position: absolute; right: -1px; top: 50%; width: 5px; height: 1px; background: var(--arbol-color-border); }
    .dtick.faint { opacity: .35; }
    .dtick.now { color: var(--arbol-color-accent); font-weight: 700; }
    .ddaylabel { position: absolute; left: 4px; transform: translateY(50%); font: 700 calc(9px * var(--arbol-font-scale))/1 var(--arbol-font-mono); letter-spacing: .3px; color: var(--arbol-color-text); white-space: nowrap; }
    .dgrid { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .dgridline { position: absolute; left: 0; right: 0; height: 0; }
    .dgridline.hour { border-top: 1px solid color-mix(in oklch, var(--arbol-color-text-muted) 13%, transparent); }
    .dgridline.half { border-top: 1px dashed color-mix(in oklch, var(--arbol-color-text-muted) 7%, transparent); }
    .dnightgap { position: absolute; left: 0; right: 0; z-index: 0; background: repeating-linear-gradient(45deg, color-mix(in oklch, var(--arbol-color-text-muted) 10%, transparent) 0 6px, transparent 6px 13px); border-top: 1px dashed var(--arbol-color-hairline); border-bottom: 1px dashed var(--arbol-color-hairline); display: grid; place-items: center; }
    .dnightgap span { font: 600 calc(9px * var(--arbol-font-scale))/1 var(--arbol-font-mono); letter-spacing: 1px; color: var(--arbol-color-text-muted); text-transform: uppercase; opacity: .7; }
    .dnow { position: absolute; left: 0; right: 0; height: 2px; background: var(--arbol-color-accent); box-shadow: 0 0 14px 1px var(--arbol-color-accent); z-index: 5; }
    .dcols { position: absolute; inset: 0; display: flex; gap: 12px; padding: 0 14px; align-items: stretch; z-index: 2; }
    .dcolwrap { position: relative; flex: 1; min-width: 0; }
    .dcol { position: relative; height: 100%; min-width: 0; overflow: hidden; border-radius: 12px 12px 0 0; box-shadow: inset 0 0 0 1px var(--arbol-color-hairline); }
    .dcol-body { position: absolute; inset: 0; }
    /* spine reused from pool seg language, repositioned to --spine */
    .dseg { position: absolute; left: var(--spine); transform: translateX(-50%); width: 26px; }
    .dseg.past { background: color-mix(in oklch, var(--arbol-color-text-muted) 36%, var(--arbol-color-surface)); border-radius: 3px 3px 8px 8px; box-shadow: inset 0 0 0 1px var(--arbol-color-hairline); }
    .dseg.past.blocked { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0) 0 5px, rgba(0,0,0,0.16) 5px 10px); }
    .dseg.future { border-radius: 8px 8px 3px 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
    .dseg.plan { border-radius: 8px; }
    .dseg.over { border-radius: 8px 8px 0 0; background: repeating-linear-gradient(45deg, oklch(0.62 0.165 25) 0 5px, oklch(0.76 0.085 24) 5px 10px); }
    .dwall { position: absolute; left: 2px; right: 2px; height: 0; border-top: 2px solid; transform: translateY(50%); z-index: 3; }
    .dflag { position: absolute; left: var(--spine); top: -9px; transform: translateX(-50%); font: 600 calc(8.5px * var(--arbol-font-scale))/1 var(--arbol-font-mono); padding: 2px 6px; border-radius: 5px; white-space: nowrap; }
    .dtimer { position: absolute; left: var(--spine); transform: translate(-50%,150%); z-index: 5; white-space: nowrap; font: 600 calc(8.5px * var(--arbol-font-scale))/1 var(--arbol-font-mono); padding: 2px 5px; border-radius: 5px; background: var(--arbol-color-surface); border: 1px solid var(--arbol-color-border); }
    .dcap { position: absolute; left: var(--spine); transform: translate(-50%,-5px); z-index: 5; white-space: nowrap; font: 600 calc(9px * var(--arbol-font-scale))/1 var(--arbol-font-mono); padding: 2px 6px; border-radius: 99px; background: var(--arbol-color-surface); border: 1px solid var(--arbol-color-border); }
    .dcap.over { color: var(--arbol-color-err); border-color: var(--arbol-color-err); }
    .dstart { position: absolute; left: var(--spine); transform: translate(-50%,50%); z-index: 5; white-space: nowrap; font: 600 calc(8px * var(--arbol-font-scale))/1 var(--arbol-font-mono); color: var(--arbol-color-text-muted); background: var(--arbol-color-surface); border: 1px dashed var(--arbol-color-border); border-radius: 99px; padding: 2px 6px; }
    .dbar { position: absolute; transform: translateX(-50%); width: 6px; border: 1px solid; border-radius: 4px; z-index: 4; }
    /* live session: the bar reaches the NOW line and breathes, with a pulsing tip */
    @keyframes obreathe-glow { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 11px 1px color-mix(in oklch, var(--ih) 70%, transparent); } }
    @keyframes obreathe-fade { 0%, 100% { opacity: .45; transform: translate(-50%, 50%) scale(.82); } 50% { opacity: 1; transform: translate(-50%, 50%) scale(1.12); } }
    .dbar.live { width: 7px; animation: obreathe-glow 2.4s ease-in-out infinite; }
    .dbar.live::after { content: ""; position: absolute; left: 50%; top: 0; width: 11px; height: 11px; border-radius: 99px; background: var(--ih); box-shadow: 0 0 0 2px var(--arbol-color-surface); animation: obreathe-fade 2.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .dbar.live, .dbar.live::after { animation: none; } }
    .ddot { position: absolute; left: var(--spine); width: 7px; height: 7px; border-radius: 99px; transform: translate(-50%,50%); z-index: 6; box-shadow: 0 0 0 2px var(--arbol-color-surface); }
    .dlead { position: absolute; z-index: 3; pointer-events: none; }
    .dlead.v { width: 0; border-left: 1px dashed color-mix(in oklch, var(--arbol-color-text-muted) 32%, transparent); }
    .dlead.v.right { left: calc(var(--spine) + 4px); }
    .dlead.v.left { left: calc(var(--spine) - 4px); }
    .dlead.h { height: 0; border-top: 1px dashed color-mix(in oklch, var(--arbol-color-text-muted) 32%, transparent); transform: translateY(50%); }
    .dlead.h.right { left: calc(var(--spine) + 4px); width: 26px; }
    .dlead.h.left { right: calc(100% - var(--spine) + 4px); width: 26px; }
    .ditem-wrap { position: absolute; transform: translateY(50%); display: flex; z-index: 6; }
    .ditem-wrap.right { left: calc(var(--spine) + 30px); right: 12px; justify-content: flex-start; }
    .ditem-wrap.left { left: 12px; right: calc(100% - var(--spine) + 30px); justify-content: flex-end; }
    .dempty { position: absolute; left: 50%; transform: translate(-50%,50%); z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
    .dempty-t { font: 500 calc(10px * var(--arbol-font-scale))/1 var(--arbol-font-mono); letter-spacing: .5px; text-transform: uppercase; color: var(--arbol-color-text-muted); opacity: .8; }
    .dempty-b { cursor: pointer; background: var(--arbol-color-surface); border: 1px dashed var(--arbol-color-border); color: var(--arbol-color-text); border-radius: 8px; padding: 7px 12px; font: 600 calc(11px * var(--arbol-font-scale))/1 var(--arbol-font-ui); }
    .dempty-b:hover { border-color: var(--arbol-color-accent); color: var(--arbol-color-accent); }
    .dheadrow { position: absolute; top: 0; left: 0; right: 0; z-index: 8; display: flex; gap: 12px; padding: 0 14px; }
    .dheadwrap { flex: 1; min-width: 0; }
    .dcol-head { display: block; width: 100%; text-align: left; cursor: pointer; min-width: 0; padding: 9px 11px 11px; border: 1px solid var(--arbol-color-border); border-top: 0; border-radius: 0 0 11px 11px; color: var(--arbol-color-text); background: linear-gradient(180deg, color-mix(in oklch, var(--arbol-color-surface) 96%, transparent) 0%, color-mix(in oklch, var(--arbol-color-surface) 92%, transparent) 86%, transparent 100%); backdrop-filter: blur(3px); box-shadow: var(--arbol-shadow-1); transition: border-color .12s; }
    .dcol-head:hover { border-color: var(--arbol-color-text-muted); }
    .dch-top { display: flex; align-items: center; gap: 8px; }
    .dch-num { font: 600 calc(8.5px * var(--arbol-font-scale))/1 var(--arbol-font-mono); letter-spacing: .8px; color: var(--arbol-color-text-muted); }
    .dch-spent { margin-left: auto; font: 600 calc(9px * var(--arbol-font-scale))/1 var(--arbol-font-mono); }
    .dch-name { margin-top: 5px; font: 600 calc(12.5px * var(--arbol-font-scale))/1.25 var(--arbol-font-ui); color: var(--arbol-color-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .dch-bot { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
    .dch-timer { margin-left: auto; font: 600 calc(9px * var(--arbol-font-scale))/1 var(--arbol-font-mono); border: 1px solid var(--arbol-color-border); border-radius: 5px; padding: 3px 6px; white-space: nowrap; }
    .dpop { position: fixed; z-index: 300; min-width: 206px; padding: 5px; background: var(--arbol-color-surface); border: 1px solid var(--arbol-color-border); border-radius: var(--arbol-radius-m); box-shadow: var(--arbol-shadow-pop); animation: arbolpop .12s ease; }
    .dpop-title { font: 600 calc(11px * var(--arbol-font-scale))/1.3 var(--arbol-font-ui); color: var(--arbol-color-text); padding: 7px 9px 8px; border-bottom: 1px solid var(--arbol-color-border); margin-bottom: 4px; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dpop-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; cursor: pointer; background: transparent; color: var(--arbol-color-text); border-radius: var(--arbol-radius-s); padding: 8px 9px; font: 500 calc(12px * var(--arbol-font-scale))/1 var(--arbol-font-ui); }
    .dpop-btn:hover { background: var(--arbol-color-surface-2); }
    .dpop-glyph { width: 16px; text-align: center; color: var(--arbol-color-text-muted); }
    .dpop-hint { font: 500 calc(9px * var(--arbol-font-scale))/1 var(--arbol-font-mono); color: var(--arbol-color-text-muted); }
    .dpop-sep { height: 1px; background: var(--arbol-color-border); opacity: .5; margin: 4px 6px; }
    .dtoast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); z-index: 400; background: var(--arbol-color-surface); border: 1px solid var(--arbol-color-border); color: var(--arbol-color-text); border-radius: 99px; padding: 9px 16px; font: 500 calc(12px * var(--arbol-font-scale))/1 var(--arbol-font-ui); box-shadow: var(--arbol-shadow-pop); animation: arbolpop .14s ease; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="shared/components.jsx"></script>
  <script type="text/babel" src="shared/themes.jsx"></script>
  <script type="text/babel" src="shared/grains.jsx"></script>
  <script type="text/babel" src="shared/chrome.jsx"></script>
  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/pool.jsx"></script>
  <script type="text/babel" src="src/details.jsx"></script>
